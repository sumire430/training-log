<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>筋トレログ</title>

<style>
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    background: #000;
    color: #fff;
  }

  .container {
    padding: 16px;
    max-width: 500px;
    margin: auto;
  }

  h1 {
    text-align: center;
    color: #ff0000;
  }

  input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
    font-size: 16px;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #007bff;
    border: none;
    color: #fff;
    font-size: 18px;
    border-radius: 10px;
  }

  .log {
    margin-top: 20px;
    padding: 10px;
    background: #111;
    border-radius: 10px;
  }

  .item {
    border-bottom: 1px solid #333;
    padding: 8px 0;
  }

</style>
</head>

<body>

<div class="container">

<h1>筋トレログ</h1>

<input type="date" id="date">
<input type="time" id="time">

<select id="part">
  <option>胸</option>
  <option>背中</option>
  <option>脚</option>
  <option>肩</option>
  <option>腕</option>
</select>

<input type="text" id="menu" placeholder="トレーニング名">
<input type="text" id="count" placeholder="回数 / 重さ">
<input type="number" id="set" placeholder="セット数">

<input type="number" id="weight" placeholder="体重">
<input type="number" id="fat" placeholder="体脂肪率">

<button onclick="save()">保存</button>

<div class="log" id="log"></div>

</div>

<script>
function save() {
  const data = {
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    part: document.getElementById("part").value,
    menu: document.getElementById("menu").value,
    count: document.getElementById("count").value,
    set: document.getElementById("set").value,
    weight: document.getElementById("weight").value,
    fat: document.getElementById("fat").value
  };

  let logs = JSON.parse(localStorage.getItem("logs")) || [];
  logs.unshift(data);
  localStorage.setItem("logs", JSON.stringify(logs));

  display();
}

function display() {
  let logs = JSON.parse(localStorage.getItem("logs")) || [];
  const logDiv = document.getElementById("log");

  logDiv.innerHTML = logs.map(item => `
    <div class="item">
      <div>${item.date} ${item.time}</div>
      <div>${item.part} - ${item.menu}</div>
      <div>${item.count} × ${item.set}</div>
      <div>体重: ${item.weight}kg / 体脂肪: ${item.fat}%</div>
    </div>
  `).join("");
}

display();
</script>

</body>
</html>
